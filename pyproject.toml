[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-concurrency-correctness-layer"
version = "0.1.0"
description = "多智能体并发正确性层：RSC = OCC + 租约 fencing + 短临界区 + Saga 补偿"
requires-python = ">=3.11"
# S11 §0.4 / Q1：egress 库本应放 `dependencies`（必需）—— 「放 optional 等于不装就绕过」。
# 但本仓库运行环境实测（见 `docs/s11-egress-enforcement.md` §11 环境探测登记）：
#   - `sandlock` / `py-landlock` 在当前索引**不存在**（`pip install` 无匹配发行版）；
#   - 容器内 `landlock_create_ruleset` 返回 ENOSYS（ABI=0），`ip netns add` 需
#     CAP_NET_ADMIN（EPERM）→ 即使装了库也**无法强制**。
# 故采用 §0.4 的第二条路径（fail-closed 开关）：
#   - 库放 `optional-dependencies.sandbox`（可解析时再装）；
#   - `Harness(egress_required=True)` 或 `HARNESS_EGRESS_REQUIRED=1` → **启动即校验**，
#     无强制点则 `EgressUnavailable`（拒绝启动）；
#   - 默认（`None`）→ 构造可跑（本地动作不经 egress，K-51），但**任何出站** fail-closed。
# 任何情况下都**不静默放行**（`harness/egress/__init__.py` 的 `EgressGuard`）。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.16"]
# 内核 LSM（Landlock）强制点：真实 API = `Sandbox(...)` + **子进程** `sandbox.run(argv)`
sandbox = ["sandlock>=0.1"]
# MS9 分布式化：Raft 组替换「单写者 seq / reserve」（MIT，2025-02 仍在维护）
# 未安装 → `RaftEventLog()` 抛 `RaftUnavailable`（fail-closed，不静默降级为单机）
raft = ["pysyncobj>=0.3.14"]
# MS10 可观测：真实 OTel 导出（**可选**；未装时 `make_otel_sink()` fail-closed）
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
# 备选 LSM 绑定（sandlock 不可解析时的降级候选；不自研 seccomp/Landlock）
landlock-alt = ["py-landlock>=0.1"]
# L7 代理（只与 netns MODE_B 搭配；单独用不构成强制点，§0.1）
proxy = ["mitmproxy>=10"]
# S22 集成适配器：宿主框架接入面（核心 `dependencies` 仍为空）
langgraph = ["langchain>=1.2", "langgraph>=1.0"]
mcp = ["mcp>=1.9"]
# S23 集成适配器（需 Python <3.14 的 crewai 单独装；见 `docs/s23-integration-plan.md`）
crewai = ["crewai>=1.15,<2"]
openai-agents = ["openai-agents>=0.13,<1"]
ag2 = ["ag2>=1.2,<2"]
integrations = ["crewai>=1.15,<2", "openai-agents>=0.13,<1", "ag2>=1.2,<2"]
# 一次装齐（索引可用时）：`pip install -e '.[egress]'`
egress = ["sandlock>=0.1", "py-landlock>=0.1", "mitmproxy>=10"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# 显式锁定的「有意为之」偏离；其余保持 ruff 默认规则集（dev extra 固定 ruff>=0.16，
# 避免不同版本默认集漂移导致 CI 结果不一致）。
ignore = [
    # 清理/回收路径（解预留、归档预算节点、落索引、通知订阅者）失败**不得**阻断
    # 主路径或掩盖返回值 —— 这是 RSC 的既有约定，逐处 try/except/pass 是刻意的。
    "S110",  # try-except-pass
    "S112",  # try-except-continue（逐条回收失败时跳过该条）
]
# 仍允许在关键处写 `# noqa: S110/S112` 说明「此处刻意吞异常」，不被 RUF100 判为死注释。
external = ["S110", "S112"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "ms0: 骨架与事件原语",
    "ms1: 单资源 RSC",
    "ms2: 预算与准入",
    "ms3: 崩溃恢复与幂等",
    "ms4: 运行时表驱动 + guard/续租 + 游标 + 调度 + 前驱闸门",
    "e2e: 端到端不变量",
    "conformance: 不变量 I1-I14 的可执行校验",
    "adversarial: 对抗用例 A1-A13",
    "slow: 长跑用例（-m 'not slow' 可跳过）",
    "serial: 需串行执行的并发用例",
    "fault: 故障注入（真实 fsync / 子进程 kill）",
    "sandbox: 子进程沙箱用例（Landlock / sandlock，需内核支持）",
    "netns: 网络命名空间用例（需 CAP_NET_ADMIN，缺失时 xfail 登记）",
    "egress: egress 强制点用例（gate / DNS 钉住 / SSRF）",
    "raft: MS9 Raft 后端用例（需 pysyncobj；缺失时 xfail 登记，真实端口/选主约 1-2s）",
]

[tool.coverage.run]
source = ["harness"]
branch = true
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80        # §4.1 兜底门禁
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "raise NotImplementedError",
]
